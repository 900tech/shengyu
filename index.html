<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="声屿——个人本地音频智能创作工作台" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'" />
  <title>声屿 · 本地音频创作工作台</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <svg class="icon-sprite" aria-hidden="true"><defs>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></symbol>
    <symbol id="i-wave" viewBox="0 0 24 24"><path d="M3 12h2l2-7 3 14 3-11 3 8 2-4h3"/></symbol>
    <symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 12 9 5 9-5M3 16l9 5 9-5"/></symbol>
    <symbol id="i-music" viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></symbol>
    <symbol id="i-command" viewBox="0 0 24 24"><path d="M9 6V5a3 3 0 1 0-3 3h12a3 3 0 1 0-3-3v14a3 3 0 1 0 3-3H6a3 3 0 1 0 3 3V6Z"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06a1.7 1.7 0 0 0-1.88-.34 1.7 1.7 0 0 0-1.03 1.55V21h-4v-.08A1.7 1.7 0 0 0 8.95 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.52-1.03H3v-4h.08A1.7 1.7 0 0 0 4.6 8.95a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.52V3h4v.08A1.7 1.7 0 0 0 15 4.6a1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 19.4 9a1.7 1.7 0 0 0 1.52 1H21v4h-.08A1.7 1.7 0 0 0 19.4 15Z"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4m0 0L7 9m5-5 5 5M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></symbol>
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="m12 3 1.4 4.1L17.5 8.5l-4.1 1.4L12 14l-1.4-4.1-4.1-1.4 4.1-1.4L12 3Z"/><path d="m19 14 .8 2.2L22 17l-2.2.8L19 20l-.8-2.2L16 17l2.2-.8L19 14Z"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3 4 6v5c0 5 3.4 8.9 8 10 4.6-1.1 8-5 8-10V6l-8-3Z"/><path d="m9 12 2 2 4-5"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7V5Z"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></symbol>
    <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 15.5A9 9 0 0 1 8.5 4 9 9 0 1 0 20 15.5Z"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9ZM10 21h4"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 4v12m0 0 5-5m-5 5-5-5M4 20h16"/></symbol>
  </defs></svg>

  <div id="app">
    <aside class="sidebar" aria-label="主导航">
      <div class="brand"><span class="brand-mark"><i></i><i></i><i></i></span><span class="brand-copy"><b>声屿</b><small>LOCAL STUDIO</small></span></div>
      <nav id="mainNav"></nav>
      <div class="side-foot">
        <div class="privacy-mark"><svg><use href="#i-lock"/></svg><span><b>本地安全</b><small>资产从未离开设备</small></span></div>
        <button class="icon-btn" id="themeToggle" aria-label="切换主题"><svg><use href="#i-moon"/></svg></button>
      </div>
    </aside>
    <main class="main-shell">
      <header class="topbar">
        <div><p class="eyebrow" id="pageEyebrow">今日工作台</p><h1 id="pageTitle">控制台</h1></div>
        <div class="top-actions">
          <button class="btn" id="advancedToggle" type="button">高级选项</button>
          <span class="connection" id="connLabel"><i></i>Agent 已连接</span>
          <span class="mode-chip" id="modeChip">全手动确认</span>
          <button class="notice-btn" data-nav="remote" aria-label="待确认指令"><svg><use href="#i-bell"/></svg><b id="pendingBadge">2</b></button>
          <button class="avatar" data-nav="settings" aria-label="打开设置">青</button>
        </div>
      </header>
      <div id="pageRoot" class="page-root"></div>
    </main>
  </div>

  <aside class="drawer" id="drawer" aria-hidden="true"><div class="drawer-head"><div><p class="eyebrow">详情</p><h2 id="drawerTitle">作品详情</h2></div><button class="icon-btn" data-close-drawer aria-label="关闭"><svg><use href="#i-x"/></svg></button></div><div id="drawerBody" class="drawer-body"></div></aside>
  <div class="overlay" id="overlay" hidden></div>
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-hidden="true"><div id="modalContent"></div></div>
  <section class="task-panel minimized" id="taskPanel"><button class="task-panel-head" id="taskPanelToggle"><span><i class="pulse-dot"></i><b>本地任务</b><em id="taskCount">0</em></span><svg><use href="#i-chevron"/></svg></button><div class="task-list" id="taskList"></div></section>
  <div class="toast-stack" id="toastStack" aria-live="polite"></div>
  <input type="file" id="filePicker" accept="audio/*,.flac,.m4a" multiple hidden />
  <script src="src/core/dictionary.js"></script>
  <script src="src/core/clean.js"></script>
  <script src="src/core/copyright.js"></script>
  <script src="src/core/safety.js"></script>
  <script src="src/core/library.js"></script>
  <script src="src/core/audio.js"></script>
  <script src="src/core/charts.js"></script>
  <script src="src/core/lyrics.js"></script>
  <script src="app.js"></script>
</body>
</html>
